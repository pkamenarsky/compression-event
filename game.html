<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>compression event</title>

  <!-- Added to the home screen, it opens with no browser around it: iOS reads
       the apple- tags, Android reads the manifest. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="compression event">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #000;
      color: #eee;
      overflow: hidden;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    #screen {
      position: absolute;
      inset: 0;
    }
  </style>
</head>
<body>
  <div id="screen"></div>
  <script type="module" src="/packages/editor/src/launch.ts"></script>
</body>
</html>
